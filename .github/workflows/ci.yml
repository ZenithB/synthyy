# CI: build + test the desktop app on both shipping platforms on every push
# and pull request (docs/WINDOWS_PORT_PLAN.md W0). The release workflow
# (desktop-release.yml) only runs on tags and runs no tests; this one is the
# gate that keeps the Mac build working while the Windows port lands.
#
# Audio hardware is not available on hosted runners: device enumeration tests
# accept an empty list, and the real-device checks live in docs/WINDOWS.md.
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # version comes from rust-toolchain.toml (keep the two in step)
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99"
          components: clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - run: npm ci

      # tsc --noEmit + vite build; also produces dist/, which the Tauri crate
      # embeds at compile time
      - run: npm run build

      - name: Clippy (warnings are errors)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      # Cross-platform render check (W6): every fixture's mixdown, compared
      # across Windows / macOS / Linux in the `parity` job below.
      - name: Render fixtures
        run: cargo run -p sf-render --example render-fixtures -- renders

      - uses: actions/upload-artifact@v4
        with:
          name: renders-${{ runner.os }}
          path: renders/
          if-no-files-found: error
          retention-days: 7

      # ASIO (Windows only): asio-sys downloads the Steinberg SDK at build
      # time and runs bindgen, which needs libclang (preinstalled on the
      # windows-latest image). Checked here so a broken ASIO build is caught
      # before a release tag.
      - name: Clippy with ASIO
        if: runner.os == 'Windows'
        run: cargo clippy -p sf-io -p synthyy --features sf-io/asio,synthyy/asio -- -D warnings

  # The same project must render the same audio on every OS: a Windows
  # export nulls against a Mac export. Fails above -90 dB residual.
  parity:
    name: render parity (Windows / macOS / Linux)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # version comes from rust-toolchain.toml (keep the two in step)
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99"

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - uses: actions/download-artifact@v4
        with:
          pattern: renders-*

      - name: Render fixtures (Linux)
        run: cargo run -p sf-render --example render-fixtures -- renders-Linux

      - name: Null-test Windows vs macOS, Windows vs Linux
        run: |
          set -o pipefail
          {
            echo "### Render parity: Windows vs macOS"
            cargo run -q -p sf-render --example null-test -- renders-Windows renders-macOS
            echo
            echo "### Render parity: Windows vs Linux"
            cargo run -q -p sf-render --example null-test -- renders-Windows renders-Linux
          } | tee -a "$GITHUB_STEP_SUMMARY"

