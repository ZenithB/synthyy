# Desktop release: builds, signs and publishes the Tauri installers when a
# `v*` tag is pushed. The web app deploys separately via Vercel — untouched here.
#
# Secrets (Settings > Secrets and variables > Actions). All optional: with none
# set the jobs still produce UNSIGNED artifacts. See docs/RELEASE.md.
#   macOS:   APPLE_CERTIFICATE (base64 .p12), APPLE_CERTIFICATE_PASSWORD,
#            APPLE_SIGNING_IDENTITY, APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID
#   Windows: WINDOWS_CERTIFICATE (base64 .pfx), WINDOWS_CERTIFICATE_PASSWORD
name: desktop-release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    name: macOS universal (sign + notarize)
    runs-on: macos-latest
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # version comes from rust-toolchain.toml (keep the two in step)
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99"
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - run: npm ci

      # Import the Developer ID Application certificate into a throwaway
      # keychain. Skipped entirely when the secret is absent (unsigned build).
      - name: Import signing certificate
        if: ${{ env.APPLE_CERTIFICATE != '' }}
        env:
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Build, sign, notarize, publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Tauri signs when APPLE_SIGNING_IDENTITY is set and notarizes when
          # the APPLE_ID trio is set; empty strings leave the build unsigned.
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          args: --target universal-apple-darwin --bundles app,dmg
          tagName: ${{ github.ref_name }}
          releaseName: "Synthyy ${{ github.ref_name }}"
          releaseBody: "See CHANGELOG / commits for details."
          releaseDraft: true
          prerelease: false

      - name: Verify signature / notarization
        if: ${{ env.APPLE_SIGNING_IDENTITY != '' }}
        run: |
          set -euo pipefail
          APP="$(ls -d target/universal-apple-darwin/release/bundle/macos/*.app | head -1)"
          DMG="$(ls target/universal-apple-darwin/release/bundle/dmg/*.dmg | head -1)"
          codesign --verify --deep --strict --verbose=2 "$APP"
          spctl -a -vv -t exec "$APP"
          xcrun stapler validate "$APP"
          xcrun stapler validate "$DMG"

      - uses: actions/upload-artifact@v4
        with:
          name: synthyy-macos-universal
          path: |
            target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

  windows:
    name: Windows x64 (MSI + NSIS)
    runs-on: windows-latest
    env:
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99"

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - run: npm ci

      # Optional Authenticode signing. Imports the .pfx into the runner's
      # CurrentUser store and hands its SHA-1 thumbprint to the bundler via
      # tauri.conf.json > bundle.windows.certificateThumbprint (set through
      # a --config override so the committed config stays null).
      - name: Import Windows certificate
        id: wincert
        if: ${{ env.WINDOWS_CERTIFICATE != '' }}
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "cert.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $pwd = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $pwd
          Remove-Item $pfx
          "thumbprint=$($cert.Thumbprint)" >> $env:GITHUB_OUTPUT
          '{"bundle":{"windows":{"certificateThumbprint":"' + $cert.Thumbprint + '"}}}' | Out-File -Encoding ascii -NoNewline (Join-Path $env:RUNNER_TEMP "sign.json")
          "TAURI_SIGN_CONFIG=" + (Join-Path $env:RUNNER_TEMP "sign.json") >> $env:GITHUB_ENV

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # --features asio: ASIO driver support (asio-sys fetches the
          # Steinberg SDK at build time; libclang is on the runner image)
          args: --bundles msi,nsis --features asio ${{ env.TAURI_SIGN_CONFIG != '' && format('--config {0}', env.TAURI_SIGN_CONFIG) || '' }}
          tagName: ${{ github.ref_name }}
          releaseName: "Synthyy ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false

      - uses: actions/upload-artifact@v4
        with:
          name: synthyy-windows-x64
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
          if-no-files-found: error
