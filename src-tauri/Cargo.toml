[package]
name = "synthyy"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "synthyy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde.workspace = true
serde_json.workspace = true
sf-io.workspace = true
sf-dsp.workspace = true
sf-engine.workspace = true
sf-project.workspace = true
sf-render.workspace = true
base64.workspace = true

[dev-dependencies]
# mock runtime: dispatch real IPC requests (raw bodies + headers) in tests
tauri = { version = "2", features = ["test"] }

[features]
default = []
# Forward to sf-io: adds ASIO as a driver type on Windows (docs/WINDOWS.md).
asio = ["sf-io/asio"]
