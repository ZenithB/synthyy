[package]
name = "sf-io"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
sf-dsp.workspace = true
sf-engine.workspace = true
sf-project.workspace = true
cpal.workspace = true
rtrb.workspace = true

[dev-dependencies]
# examples/play-project.rs: parse + default-fill a ProjectJSON from disk
sf-render.workspace = true
serde_json.workspace = true

# MMCSS ("Pro Audio") registration of the WASAPI callback thread. Same
# version Tauri/WebView2 already pull in, so nothing new is downloaded.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }

[features]
default = []
# ASIO driver support (Windows only; a no-op elsewhere). Building it needs the
# Steinberg ASIO SDK (CPAL_ASIO_DIR) and LLVM/clang for bindgen — see
# docs/WINDOWS.md. Not on by default so a plain checkout always builds.
asio = ["cpal/asio"]
